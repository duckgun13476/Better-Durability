import groovy.json.JsonOutput

import java.net.HttpURLConnection
import java.net.URI
import java.security.MessageDigest

// BDC's two loader projects publish independently, but use the same credentials,
// changelog and release conventions from the repository root.
ext.bdcReadPublishingProperties = {
    File credentials = rootProject.file('api.properties')
    if (!credentials.isFile()) return null
    Properties properties = new Properties()
    credentials.withInputStream { properties.load(it) }
    properties
}

ext.bdcReadStringListProperty = { String name ->
    def value = project.findProperty(name)
    if (value == null) return []
    value instanceof Collection
            ? value.collect { it.toString().trim() }.findAll { !it.isEmpty() }
            : value.toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
}

ext.bdcReadArtifactTaskName = { project.findProperty('bdc_publish_artifact_task_name')?.toString()?.trim() ?: 'jar' }
ext.bdcReadArtifactPreparationTaskName = { project.findProperty('bdc_publish_preparation_task_name')?.toString()?.trim() ?: bdcReadArtifactTaskName() }
ext.bdcReadArtifact = {
    def task = tasks.named(bdcReadArtifactTaskName()).get()
    if (!task.hasProperty('archiveFile')) throw new GradleException("Publish task '${task.name}' has no archiveFile for ${project.path}")
    task.archiveFile.get().asFile
}
ext.bdcReadLoader = { project.findProperty('bdc_publish_loader_id')?.toString()?.trim() ?: '' }
// BDC's mod_version already begins with its Minecraft version (for example
// 1.21.1-1.3.8), so adding minecraft_version again would create a duplicate.
ext.bdcReadVersion = { "${mod_version}-${bdcReadLoader()}" }
ext.bdcReadDisplayName = { "${mod_name} ${mod_version} for Minecraft ${minecraft_version} (${bdcReadLoader()})" }
ext.bdcReadChangelog = {
    File changelog = rootProject.file('update/changelog.md')
    changelog.isFile() ? changelog.getText('UTF-8') : ''
}
ext.bdcReadPrimaryChangelog = {
    String text = bdcReadChangelog()
    def matcher = text =~ /(?ms)\A(#{1,4}\s+[^\r\n]+.*?)(?=\r?\n#{1,4}\s+[^\r\n]+|\z)/
    matcher.find() ? matcher.group(1).trim() : text.trim()
}
ext.bdcSha256 = { File file ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
}

ext.bdcRequirePublishConfiguration = {
    List<String> missing = []
    if (!bdcReadLoader()) missing.add('bdc_publish_loader_id')
    if (!(project.findProperty('curseforge_id')?.toString()?.trim())) missing.add('curseforge_id')
    if (!(project.findProperty('modrinth_id')?.toString()?.trim())) missing.add('modrinth_id')
    def credentials = bdcReadPublishingProperties()
    if (!(credentials?.getProperty('CF_TOKEN')?.trim())) missing.add('CF_TOKEN in api.properties')
    if (!(credentials?.getProperty('MODRINTH_TOKEN')?.trim())) missing.add('MODRINTH_TOKEN in api.properties')
    if (!missing.isEmpty()) throw new GradleException("Publishing is not configured for ${project.path}: ${missing.join(', ')}")
}

tasks.register('verifyPublishArtifact') {
    group = 'Publishing'
    dependsOn bdcReadArtifactPreparationTaskName()
    doLast {
        File artifact = bdcReadArtifact()
        if (!artifact.isFile() || artifact.length() == 0L) throw new GradleException("Publish artifact is missing or empty: ${artifact}")
        logger.lifecycle("Verified ${project.path} publish artifact: ${artifact.name}, sha256=${bdcSha256(artifact)}")
    }
}

tasks.register('publishInfo') {
    group = 'Publishing'
    doLast {
        File artifact = bdcReadArtifact()
        logger.lifecycle("${project.path}: version=${bdcReadVersion()}, displayName=${bdcReadDisplayName()}, artifact=${artifact.absolutePath}")
    }
}

tasks.register('validatePublishingConfiguration') {
    group = 'Publishing'
    doLast { bdcRequirePublishConfiguration() }
}

ext.bdcCurseForgeGameVersions = {
    Map<String, Long> minecraft = ['1.20.1': 9990L, '1.21.1': 11779L]
    Map<String, Long> loader = [forge: 7498L, neoforge: 10150L]
    Long minecraftId = minecraft[minecraft_version.toString()]
    Long loaderId = loader[bdcReadLoader().toLowerCase(Locale.ROOT)]
    if (minecraftId == null || loaderId == null) throw new GradleException("No CurseForge version mapping for ${minecraft_version}/${bdcReadLoader()}")
    [minecraftId, 9638L, 9639L, loaderId].unique()
}
ext.bdcWriteMultipartText = { OutputStream output, String boundary, String name, String value ->
    output.write(("--${boundary}\r\nContent-Disposition: form-data; name=\"${name}\"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${value}\r\n").getBytes('UTF-8'))
}
ext.bdcWriteMultipartFile = { OutputStream output, String boundary, File artifact ->
    output.write(("--${boundary}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"${artifact.name}\"\r\nContent-Type: application/java-archive\r\n\r\n").getBytes('UTF-8'))
    artifact.withInputStream { it.transferTo(output) }
    output.write('\r\n'.getBytes('UTF-8'))
}

tasks.register('publishCurseForge') {
    group = 'Publishing'
    description = 'Uploads the final artifact to CurseForge through the existing authenticated legacy endpoint.'
    dependsOn 'verifyPublishArtifact', 'validatePublishingConfiguration'
    doLast {
        File artifact = bdcReadArtifact()
        String token = bdcReadPublishingProperties().getProperty('CF_TOKEN').trim()
        Map metadata = [
                changelog    : bdcReadPrimaryChangelog(),
                changelogType: 'markdown',
                displayName  : bdcReadDisplayName(),
                releaseType  : (project.findProperty('publish_version')?.toString()?.trim() ?: 'release'),
                gameVersions : bdcCurseForgeGameVersions()
        ]
        String boundary = "----BetterDurabilityCommunity${UUID.randomUUID().toString().replace('-', '')}"
        URI endpoint = URI.create("https://minecraft.curseforge.com/api/projects/${curseforge_id}/upload-file")
        HttpURLConnection connection = (HttpURLConnection) endpoint.toURL().openConnection()
        connection.requestMethod = 'POST'
        connection.doOutput = true
        connection.connectTimeout = 30000
        connection.readTimeout = 120000
        connection.setRequestProperty('Accept', 'application/json')
        connection.setRequestProperty('User-Agent', 'BetterDurabilityCommunity-publisher')
        connection.setRequestProperty('X-Api-Token', token)
        connection.setRequestProperty('Content-Type', "multipart/form-data; boundary=${boundary}")
        connection.outputStream.withCloseable { output ->
            bdcWriteMultipartText(output, boundary, 'metadata', JsonOutput.toJson(metadata))
            bdcWriteMultipartFile(output, boundary, artifact)
            output.write(("--${boundary}--\r\n").getBytes('UTF-8'))
        }
        int status = connection.responseCode
        InputStream body = status >= 400 ? connection.errorStream : connection.inputStream
        String response = body == null ? '' : body.getText('UTF-8').replaceAll(/\s+/, ' ').take(500)
        if (status < 200 || status >= 300) throw new GradleException("CurseForge upload failed for ${project.path}: HTTP ${status}${response ? " (${response})" : ''}")
        logger.lifecycle("CurseForge upload completed for ${project.path}: ${artifact.name}")
    }
}

publishMods {
    def credentials = bdcReadPublishingProperties()
    String token = credentials?.getProperty('MODRINTH_TOKEN')?.trim()
    String projectId = project.findProperty('modrinth_id')?.toString()?.trim()
    if (token && projectId) {
        file = bdcReadArtifact()
        changelog = bdcReadChangelog()
        type = (project.findProperty('publish_version')?.toString()?.trim()?.toLowerCase(Locale.ROOT) == 'beta') ? BETA : STABLE
        version = bdcReadVersion()
        displayName = bdcReadDisplayName()
        modLoaders.add(bdcReadLoader())
        modrinth {
            accessToken = token
            projectId = projectId
            minecraftVersions.add(minecraft_version)
        }
    }
}

tasks.named('publishMods').configure {
    dependsOn 'verifyPublishArtifact', 'validatePublishingConfiguration'
}

tasks.register('publishAll') {
    group = 'Publishing'
    description = 'Publishes this loader/version to CurseForge and Modrinth.'
    dependsOn 'publishCurseForge', 'publishMods'
}

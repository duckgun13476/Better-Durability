def loadBdcProperties = { File propertyFile ->
    if (propertyFile == null || !propertyFile.isFile()) {
        return
    }

    Properties properties = new Properties()
    propertyFile.withInputStream { properties.load(it) }
    properties.each { key, value ->
        String propertyName = key.toString()
        if (!project.hasProperty(propertyName)) {
            project.ext.set(propertyName, value)
        }
    }
}

def findBdcCommonProperties = {
    File currentDir = project.projectDir
    while (currentDir != null) {
        File candidate = new File(currentDir, 'gradle/bdc-common.properties')
        if (candidate.isFile()) {
            return candidate
        }
        currentDir = currentDir.parentFile
    }
    return null
}

File commonProperties = findBdcCommonProperties()
if (commonProperties == null) {
    throw new GradleException("Unable to locate gradle/bdc-common.properties for ${project.path}")
}

File repositoryRoot = commonProperties.parentFile.parentFile
String relativeProjectPath = repositoryRoot.toPath().relativize(project.projectDir.toPath())
        .toString()
        .replace('\\', '-')
        .replace('/', '-')
File versionProperties = new File(repositoryRoot, "gradle/bdc-versions/${relativeProjectPath}.properties")
if (!versionProperties.isFile()) {
    throw new GradleException("Missing BDC version properties for ${project.path}: ${versionProperties.absolutePath}")
}

loadBdcProperties(commonProperties)
loadBdcProperties(versionProperties)

if (!project.hasProperty('release_version')) {
    throw new GradleException("Missing shared release_version for ${project.path}")
}
if (!project.hasProperty('mod_version')) {
    project.ext.set('mod_version', project.findProperty('release_version').toString())
}

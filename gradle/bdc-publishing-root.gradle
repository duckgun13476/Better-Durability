def bdcPublishableProjects = [':forge-1.19.2', ':forge-1.20.1', ':neoforge-1.21.1']
def bdcForge1192Dir = rootProject.file('project/forge/1.19.2')
def bdcForge1192Java = project.services.get(org.gradle.jvm.toolchain.JavaToolchainService).launcherFor { spec ->
    spec.languageVersion = JavaLanguageVersion.of(17)
}

def bdcForge1192Task = { String name, String description, List<String> arguments ->
    tasks.register(name, Exec) {
        group = 'Publishing'
        this.description = description
        workingDir bdcForge1192Dir
        commandLine 'cmd', '/c', 'gradlew.bat', *arguments,
                '-Dnet.minecraftforge.gradle.check.certs=false',
                '--no-daemon', '--no-configuration-cache', '--console=plain'
        doFirst {
            def javaHome = bdcForge1192Java.get().metadata.installationPath.asFile.absolutePath
            environment 'JAVA_HOME', javaHome
            environment 'PATH', "${javaHome}${File.separator}bin${File.pathSeparator}${System.getenv('PATH')}"
        }
    }
}

def bdcForge1192Build = bdcForge1192Task(
        'forge1192Build',
        'Builds the standalone Forge 1.19.2 artifact with Java 17 and Gradle 7.4.',
        ['build'])

gradle.projectsEvaluated {
    Task previousCurseForgeTask = null
    Task previousModrinthTask = null

    bdcPublishableProjects.collect { rootProject.project(it) }.each { targetProject ->
        Task curseForgeTask = targetProject.tasks.findByName('publishCurseForge')
        Task modrinthTask = targetProject.tasks.findByName('publishModrinth')
        Task publishModsTask = targetProject.tasks.findByName('publishMods')

        if (curseForgeTask != null) {
            if (previousCurseForgeTask != null) curseForgeTask.mustRunAfter(previousCurseForgeTask)
            if (previousModrinthTask != null) curseForgeTask.mustRunAfter(previousModrinthTask)
        }
        if (modrinthTask != null) {
            if (curseForgeTask != null) modrinthTask.mustRunAfter(curseForgeTask)
            if (previousCurseForgeTask != null) modrinthTask.mustRunAfter(previousCurseForgeTask)
            if (previousModrinthTask != null) modrinthTask.mustRunAfter(previousModrinthTask)
        }
        if (publishModsTask != null && modrinthTask != null) {
            publishModsTask.mustRunAfter(modrinthTask)
        }

        if (curseForgeTask != null) previousCurseForgeTask = curseForgeTask
        if (modrinthTask != null) previousModrinthTask = modrinthTask
    }
}

tasks.register('packageAllVersions') {
    group = 'Publishing'
    description = 'Builds and verifies the final Forge 1.19.2, Forge 1.20.1, and NeoForge 1.21.1 artifacts.'
    dependsOn bdcForge1192Build
    dependsOn bdcPublishableProjects.collect { "${it}:verifyPublishArtifact" }
}

tasks.register('publishInfoAllVersions') {
    group = 'Publishing'
    description = 'Shows the publication targets without uploading.'
    dependsOn bdcPublishableProjects.collect { "${it}:publishInfo" }
}

tasks.register('publishAllVersions') {
    group = 'Publishing'
    description = 'Publishes the supported Forge 1.19.2, Forge 1.20.1, and NeoForge 1.21.1 versions.'
    dependsOn 'packageAllVersions'
    dependsOn bdcPublishableProjects.collect { "${it}:publishAll" }
}

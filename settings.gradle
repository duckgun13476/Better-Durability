pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'BetterDurabilityCommunity'

include 'forge-1.20.1'
include 'neoforge-1.21.1'
include 'forge-1.19.2'

project(':forge-1.19.2').projectDir = file('publication/forge/1.19.2')
project(':forge-1.20.1').projectDir = file('project/forge/1.20.1')
project(':neoforge-1.21.1').projectDir = file('project/neoforge/1.21.1')

plugins {
    id 'base'
}

allprojects {
    repositories {
        mavenCentral()
    }
}

tasks.named('build') {
    dependsOn ':forge-1.20.1:build', ':neoforge-1.21.1:build'
}

tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Build the Forge 1.20.1 and NeoForge 1.21.1 distributions.'
    dependsOn ':forge-1.20.1:build', ':neoforge-1.21.1:build'
}

apply from: rootProject.file('gradle/bdc-publishing-root.gradle')
apply from: rootProject.file('gradle/bdc-discord-publishing.gradle')
